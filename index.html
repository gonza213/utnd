<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNTD Financial Group | Próximamente</title>
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Fondo oscuro como la imagen */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        /* Estilo para el logo */
        .logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
            /* Filtro opcional para dar brillo */
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #d4af37; /* Color dorado para combinar con el logo */
        }

        p {
            font-size: 1.1rem;
            color: #a0a0a0;
            line-height: 1.6;
        }

        /* Botón elegante */
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #d4af37;
            color: #121212;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #f1c40f;
        }

        /* Línea decorativa */
        .divider {
            height: 2px;
            width: 50px;
            background-color: #d4af37;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://res.cloudinary.com/dazfmv5ls/image/upload/v1768431298/600214178_4248395572100004_2075737591426130777_n_ychkfe.jpg" alt="UNTD Financial Group Logo" class="logo">
        
        <div class="divider"></div>
        
        <h1>BIENVENIDO</h1>
        <p>Estamos trabajando en nuestra nueva plataforma financiera para brindarte la mejor experiencia de inversión y gestión.</p>
        
        <a href="mailto:info@untd.com" class="btn">CONTÁCTANOS</a>
    </div>

</body>
</html>
